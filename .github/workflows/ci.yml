name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  acceptance:
    name: Acceptance suite, litmus and nextcloudcmd (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install litmus and nextcloudcmd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends litmus nextcloud-desktop-cmd
          nextcloudcmd --version

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            acceptance -> target

      # Builds the server, starts it on a throwaway installation, runs the black-box suite
      # (failures must match acceptance/new-expected-failures.txt) and then litmus against
      # /remote.php/dav/files/<user>/. Both must pass.
      - name: Acceptance suite and litmus
        env:
          RUN_LITMUS: "1"
        run: acceptance/scripts/run-new.sh

      # Syncs two folders with the Nextcloud desktop client's command line tool: first sync,
      # upload, a deep change from the other device, renames (including case-only), deletes and
      # a chunked upload.
      - name: nextcloudcmd sync scenarios
        run: acceptance/scripts/nextcloudcmd-scenarios.sh

  # Packs a debug build the way the release workflow packs release builds (on Linux a static
  # musl build with cargo-zigbuild, as released) and runs the install script end to end on the
  # runner: refused installs, a fresh install as a systemd service or launchd job, WebDAV
  # through the service, the CLI's root guard, a graceful stop, an upgrade and the uninstall.
  # On Linux it also checks that the binary is static and runs without glibc. See
  # packaging/server/test-install.sh and test-static.sh.
  install:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "${RUNNER_OS}" = Linux ]; then
            rustup target add "$(uname -m)-unknown-linux-musl"
          fi

      - name: Install zig and cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "${RUNNER_TEMP}/zigbuild"
          "${RUNNER_TEMP}/zigbuild/bin/pip" install --require-hashes --no-deps \
            -r packaging/server/zigbuild-requirements.txt
          echo "${RUNNER_TEMP}/zigbuild/bin" >> "${GITHUB_PATH}"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Lint the scripts and service files
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
            shellcheck --version | sed -n 2p
            shellcheck -s sh packaging/server/*.sh
          else
            plutil -lint packaging/server/launchd/*.plist
          fi

      - name: Build
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            target="$(uname -m)-unknown-linux-musl"
            cargo zigbuild --locked -p gono-server --target "${target}"
            binary="target/${target}/debug/gono-cloud"
          else
            target="$(rustc -vV | sed -n 's/^host: //p')"
            cargo build --locked -p gono-server
            binary="target/debug/gono-cloud"
          fi
          echo "TARGET=${target}" >> "${GITHUB_ENV}"
          echo "BINARY=${binary}" >> "${GITHUB_ENV}"

      - name: Package
        run: packaging/server/package.sh "${TARGET}" "${BINARY}" dist

      - name: Static binary without glibc
        if: runner.os == 'Linux'
        run: packaging/server/test-static.sh dist/*.tar.gz

      - name: Install, upgrade and uninstall
        run: packaging/server/test-install.sh packaging/server/install.sh dist/*.tar.gz

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "${msrv}"
          echo "Workspace rust-version: ${msrv}"
          rustup toolchain install "${msrv}" --profile minimal
          rustup default "${msrv}"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --locked
