{%- extends "card.html" -%}
{%- block title %}{{ chrome.t.a_not_admin }}{% endblock -%}
{%- block card %}
<h1>{{ chrome.t.a_not_admin }}</h1>
<p class="muted mt-6">{{ chrome.t.a_not_admin_before }}<b>{{ username }}</b>{{ chrome.t.a_not_admin_after }}</p>
<form method="post" action="{{ prefix }}/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn primary block" type="submit">{{ chrome.t.sign_out }}</button></form>
{%- endblock %}
