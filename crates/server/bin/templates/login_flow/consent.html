{%- extends "card.html" -%}
{%- block title %}{{ chrome.t.grant_title }}{% endblock -%}
{%- block card %}
<h1>{{ chrome.t.grant_question }}</h1>
<p class="mt-6"><span class="client">{{ client }}</span> {{ chrome.t.grant_asks }} <b>{{ account }}</b>.</p>
<p class="muted small">{{ chrome.t.grant_note }}</p>
<div class="split">
  <form method="post" action=""><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn primary block" type="submit" name="action" value="grant">{{ chrome.t.grant }}</button></form>
  <form method="post" action=""><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn block" type="submit" name="action" value="deny">{{ chrome.t.cancel }}</button></form>
</div>
<form method="post" action="" class="signed-as"><input type="hidden" name="csrf" value="{{ csrf }}"><span>{{ not_you }}</span><button class="btn link" type="submit" name="action" value="logout">{{ chrome.t.log_out }}</button></form>
{%- endblock %}
