{%- extends "card.html" -%}
{%- block title %}{{ chrome.t.connect_device }}{% endblock -%}
{%- block card %}
<h1>{{ chrome.t.connect_device }}</h1>
<p class="muted mt-6"><span class="client">{{ client }}</span> {{ chrome.t.flow_sign_in_lead }}</p>
{%- if let Some(error) = error %}
<div class="flash bad" role="alert">{{ error }}</div>
{%- endif %}
<form method="post" action="">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="action" value="login">
  <label class="field" for="flow-user"><span>{{ chrome.t.username }}</span>
    <input id="flow-user" type="text" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
  <label class="field" for="flow-password"><span>{{ chrome.t.password }}</span>
    <input id="flow-password" type="password" name="password" autocomplete="current-password" required></label>
  <button class="btn primary block" type="submit">{{ chrome.t.log_in }}</button>
</form>
<p class="muted small mt-18">{{ chrome.t.flow_sign_in_note }}</p>
{%- endblock %}
