{%- extends "card.html" -%}
{%- block title %}Sign in{% endblock -%}
{%- block brand_sub %}<span class="brand-sub">Admin</span>{% endblock -%}
{%- block card %}
<h1>Sign in</h1>
<p class="muted mt-6">Use your web login password. App passwords of devices do not work here.</p>
{%- if let Some(error) = error %}
<div class="flash bad" role="alert">{{ error }}</div>
{%- endif %}
<form method="post" action="{{ prefix }}/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="field" for="login-user"><span>Username</span>
    <input id="login-user" type="text" name="user" value="{{ user }}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
  <label class="field" for="login-password"><span>Password</span>
    <input id="login-password" type="password" name="password" autocomplete="current-password" required></label>
  <button class="btn primary block" type="submit">Sign in</button>
</form>
{%- endblock %}
