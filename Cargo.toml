[workspace]
members = ["crates/*"]
# The acceptance suite is a standalone crate with its own `[workspace]`. Vendored third-party
# crates are built as dependencies only, without the workspace lints.
exclude = ["acceptance", "vendor"]
resolver = "3"

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
# Highest requirement among edition 2024 (1.85) and the dependency tree; sqlx 0.9 needs 1.94.
# CI checks the workspace with exactly this toolchain.
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gonolab/cloud.server"
publish = false

[workspace.dependencies]
# Internal crates.
gono-core = { path = "crates/core" }
gono-dav = { path = "crates/dav" }
gono-nextcloud = { path = "crates/nextcloud" }

# Pinned exactly: the WebDAV layer is built against this version's trait surface
# (`GuardedFileSystem`, `DavMetaData`, `DavLockSystem`). Upgrade deliberately.
dav-server = { version = "=0.11.0", default-features = false, features = ["localfs"] }

anyhow = "1.0.100"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.0", features = ["derive", "env", "wrap_help"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
ipnet = "2.12.0"
libc = "0.2.191"
pin-project-lite = "0.2.17"
rand = "0.10.3"
rpassword = "7.5.0"
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite-bundled",
  "migrate",
  "macros",
] }
tempfile = "3.27.0"
thiserror = "2.0.17"
tokio = "1.54.0"
tokio-tungstenite = "0.29.0"
toml = "1.2.0"
tower-layer = "0.3.3"
tower-service = "0.3.3"
unicode-normalization = "0.1.26"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "smallvec",
  "std",
] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.2", features = ["v4"] }
xmltree = "0.12.0"

# dav-server 0.11.0 with local fixes; see vendor/dav-server/VENDORED.md.
[patch.crates-io]
dav-server = { path = "vendor/dav-server" }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
large_types_passed_by_value = "warn"
semicolon_if_nothing_returned = "warn"
