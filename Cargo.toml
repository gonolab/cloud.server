[workspace]
members = ["crates/*"]
# The acceptance suite is a standalone crate with its own `[workspace]`.
exclude = ["acceptance"]
resolver = "3"

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
# Highest requirement among edition 2024 (1.85) and the dependency tree; sqlx 0.9 needs 1.94.
# CI checks the workspace with exactly this toolchain.
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gonolab/cloud.server"
publish = false

[workspace.dependencies]
# Internal crates.
gono-core = { path = "crates/core" }
gono-dav = { path = "crates/dav" }
gono-nextcloud = { path = "crates/nextcloud" }

# Pinned exactly: the WebDAV layer is built against this version's trait surface
# (`GuardedFileSystem`, `DavMetaData`, `DavLockSystem`). Upgrade deliberately.
dav-server = { version = "=0.11.0", default-features = false, features = ["localfs"] }

anyhow = "1.0.100"
argon2 = "0.6.0"
axum = "0.8.9"
clap = { version = "4.6.0", features = ["derive", "env", "wrap_help"] }
ipnet = "2.12.0"
rpassword = "7.5.0"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite-bundled",
  "migrate",
  "macros",
] }
tempfile = "3.27.0"
thiserror = "2.0.17"
tokio = "1.54.0"
toml = "1.2.0"
unicode-normalization = "0.1.26"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "smallvec",
  "std",
] }
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
large_types_passed_by_value = "warn"
semicolon_if_nothing_returned = "warn"
