name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  acceptance:
    name: Acceptance suite, litmus and nextcloudcmd (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install litmus and nextcloudcmd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends litmus nextcloud-desktop-cmd
          nextcloudcmd --version

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            acceptance -> target

      # Builds the server, starts it on a throwaway installation, runs the black-box suite
      # (failures must match acceptance/new-expected-failures.txt) and then litmus against
      # /remote.php/dav/files/<user>/. Both must pass.
      - name: Acceptance suite and litmus
        env:
          RUN_LITMUS: "1"
        run: acceptance/scripts/run-new.sh

      # Syncs two folders with the Nextcloud desktop client's command line tool: first sync,
      # upload, a deep change from the other device, renames (including case-only), deletes and
      # a chunked upload.
      - name: nextcloudcmd sync scenarios
        run: acceptance/scripts/nextcloudcmd-scenarios.sh

  # Packs a debug build the way the release workflow packs release builds and runs the install
  # script end to end on the runner: refused installs, a fresh install as a systemd service or
  # launchd job, WebDAV through the service, the CLI's root guard, a graceful stop, an upgrade
  # and the uninstall. See packaging/server/test-install.sh.
  install:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Lint the scripts and service files
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
            shellcheck --version | head -n 2
            shellcheck -s sh packaging/server/*.sh
          else
            plutil -lint packaging/server/launchd/*.plist
          fi

      - name: Build
        run: cargo build --locked -p gono-server

      - name: Package
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          packaging/server/package.sh "${host}" target/debug/gono-cloud dist

      - name: Install, upgrade and uninstall
        run: packaging/server/test-install.sh packaging/server/install.sh dist/*.tar.gz

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "${msrv}"
          echo "Workspace rust-version: ${msrv}"
          rustup toolchain install "${msrv}" --profile minimal
          rustup default "${msrv}"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --locked
