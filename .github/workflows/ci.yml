name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  acceptance:
    name: Acceptance suite and litmus (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install litmus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends litmus

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            acceptance -> target

      # Builds the server, starts it on a throwaway installation, runs the black-box suite
      # (failures must match acceptance/new-expected-failures.txt) and then litmus against
      # /remote.php/dav/files/<user>/. Both must pass.
      - name: Acceptance suite and litmus
        env:
          RUN_LITMUS: "1"
        run: acceptance/scripts/run-new.sh

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "${msrv}"
          echo "Workspace rust-version: ${msrv}"
          rustup toolchain install "${msrv}" --profile minimal
          rustup default "${msrv}"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets --locked
